<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Soyut 3D Sahne</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05060a;
    font-family: -apple-system, "Segoe UI", sans-serif;
    color: #cfd3de;
  }
  #info {
    position: fixed;
    top: 16px; left: 16px;
    font-size: 13px;
    background: rgba(10,12,18,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    pointer-events: none;
    line-height: 1.5;
    z-index: 10;
  }
  #info b { color: #fff; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="info">
  <b>Soyut Sanatsal Sahne</b><br/>
  Fare ile döndür · Tekerlekle yakınlaş · Sağ tık ile kaydır
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// ---- Sahne Kurulumu ----
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060a, 0.025);

const camera = new THREE.PerspectiveCamera(
  55, window.innerWidth / window.innerHeight, 0.1, 200
);
camera.position.set(0, 2, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// ---- Arka plan gradyanı (büyük küre) ----
const bgGeo = new THREE.SphereGeometry(80, 32, 32);
const bgMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    top:    { value: new THREE.Color(0x1a0b3d) },
    bottom: { value: new THREE.Color(0x06070f) }
  },
  vertexShader: `
    varying vec3 vPos;
    void main() {
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vPos;
    uniform vec3 top;
    uniform vec3 bottom;
    void main() {
      float h = normalize(vPos).y * 0.5 + 0.5;
      gl_FragColor = vec4(mix(bottom, top, h), 1.0);
    }
  `
});
scene.add(new THREE.Mesh(bgGeo, bgMat));

// ---- Işıklar ----
scene.add(new THREE.AmbientLight(0x334477, 0.6));
const keyLight = new THREE.PointLight(0xff5bb0, 2.2, 40);
keyLight.position.set(6, 6, 6);
scene.add(keyLight);
const fillLight = new THREE.PointLight(0x6bc1ff, 1.8, 40);
fillLight.position.set(-7, -3, 4);
scene.add(fillLight);
const rim = new THREE.DirectionalLight(0xffffff, 0.4);
rim.position.set(0, 10, -8);
scene.add(rim);

// ---- Yüzen geometriler ----
const palette = [0xff5bb0, 0x6bc1ff, 0xa46bff, 0xffd26b, 0x4fffcf];
const shapes = [];
const geometries = [
  new THREE.IcosahedronGeometry(0.9, 0),
  new THREE.TetrahedronGeometry(1.0),
  new THREE.OctahedronGeometry(0.8),
  new THREE.TorusKnotGeometry(0.6, 0.22, 100, 16),
  new THREE.DodecahedronGeometry(0.85)
];

for (let i = 0; i < 18; i++) {
  const geo = geometries[i % geometries.length];
  const mat = new THREE.MeshPhysicalMaterial({
    color: palette[i % palette.length],
    metalness: 0.3,
    roughness: 0.2,
    clearcoat: 0.8,
    clearcoatRoughness: 0.1,
    transmission: i % 3 === 0 ? 0.6 : 0,
    thickness: 0.5,
    emissive: palette[i % palette.length],
    emissiveIntensity: 0.08
  });
  const m = new THREE.Mesh(geo, mat);
  const r = 4 + Math.random() * 4;
  const a = Math.random() * Math.PI * 2;
  const y = (Math.random() - 0.5) * 6;
  m.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
  m.userData = {
    baseY: y,
    speed: 0.2 + Math.random() * 0.6,
    phase: Math.random() * Math.PI * 2,
    rotSpeed: new THREE.Vector3(
      (Math.random() - 0.5) * 0.8,
      (Math.random() - 0.5) * 0.8,
      (Math.random() - 0.5) * 0.8
    ),
    orbitSpeed: (Math.random() - 0.5) * 0.2,
    orbitRadius: r,
    orbitAngle: a
  };
  scene.add(m);
  shapes.push(m);
}

// ---- Merkez parlayan küre ----
const core = new THREE.Mesh(
  new THREE.SphereGeometry(1.1, 64, 64),
  new THREE.MeshBasicMaterial({ color: 0xffffff })
);
scene.add(core);

const glow = new THREE.Mesh(
  new THREE.SphereGeometry(1.8, 32, 32),
  new THREE.ShaderMaterial({
    transparent: true,
    blending: THREE.AdditiveBlending,
    uniforms: { c: { value: new THREE.Color(0xff7fcf) } },
    vertexShader: `
      varying vec3 vN;
      void main() {
        vN = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vN;
      uniform vec3 c;
      void main() {
        float intensity = pow(1.0 - abs(vN.z), 2.0);
        gl_FragColor = vec4(c * intensity, intensity);
      }
    `
  })
);
scene.add(glow);

// ---- Parçacık bulutu ----
const particleCount = 1400;
const pGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const colors = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount; i++) {
  const r = 6 + Math.random() * 20;
  const t = Math.random() * Math.PI * 2;
  const p = Math.acos(2 * Math.random() - 1);
  positions[i * 3]     = r * Math.sin(p) * Math.cos(t);
  positions[i * 3 + 1] = r * Math.sin(p) * Math.sin(t) * 0.4;
  positions[i * 3 + 2] = r * Math.cos(p);
  const col = new THREE.Color(palette[i % palette.length]);
  colors[i * 3]     = col.r;
  colors[i * 3 + 1] = col.g;
  colors[i * 3 + 2] = col.b;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
pGeo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
const pMat = new THREE.PointsMaterial({
  size: 0.06,
  vertexColors: true,
  transparent: true,
  opacity: 0.85,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

// ---- Basit orbit kontrol (fare ile) ----
let isDown = false, isRight = false;
let lastX = 0, lastY = 0;
let camTheta = 0, camPhi = Math.PI / 2.4, camDist = 14;
const target = new THREE.Vector3(0, 0, 0);

function updateCamera() {
  camera.position.set(
    target.x + camDist * Math.sin(camPhi) * Math.cos(camTheta),
    target.y + camDist * Math.cos(camPhi),
    target.z + camDist * Math.sin(camPhi) * Math.sin(camTheta)
  );
  camera.lookAt(target);
}
updateCamera();

renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
renderer.domElement.addEventListener('mousedown', e => {
  isDown = true;
  isRight = e.button === 2;
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mouseup', () => { isDown = false; isRight = false; });
window.addEventListener('mousemove', e => {
  if (!isDown) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (isRight) {
    const panScale = camDist * 0.0015;
    const right = new THREE.Vector3(
      Math.cos(camTheta), 0, -Math.sin(camTheta)
    );
    const up = new THREE.Vector3(0, 1, 0);
    target.addScaledVector(right, -dx * panScale);
    target.addScaledVector(up,    dy * panScale);
  } else {
    camTheta -= dx * 0.005;
    camPhi   = Math.min(Math.PI - 0.1, Math.max(0.1, camPhi - dy * 0.005));
  }
  updateCamera();
});
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  camDist = Math.min(40, Math.max(3, camDist * (1 + e.deltaY * 0.001)));
  updateCamera();
}, { passive: false });

// ---- Animasyon ----
const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();

  for (const m of shapes) {
    const d = m.userData;
    d.orbitAngle += d.orbitSpeed * 0.01;
    m.position.x = Math.cos(d.orbitAngle) * d.orbitRadius;
    m.position.z = Math.sin(d.orbitAngle) * d.orbitRadius;
    m.position.y = d.baseY + Math.sin(t * d.speed + d.phase) * 0.6;
    m.rotation.x += d.rotSpeed.x * 0.01;
    m.rotation.y += d.rotSpeed.y * 0.01;
    m.rotation.z += d.rotSpeed.z * 0.01;
  }

  particles.rotation.y = t * 0.03;
  core.scale.setScalar(1 + Math.sin(t * 2) * 0.05);
  glow.scale.setScalar(1 + Math.sin(t * 2) * 0.08);

  // Işıklar yavaşça dolaş
  keyLight.position.x = Math.cos(t * 0.4) * 8;
  keyLight.position.z = Math.sin(t * 0.4) * 8;
  fillLight.position.x = Math.cos(t * 0.3 + Math.PI) * 8;
  fillLight.position.z = Math.sin(t * 0.3 + Math.PI) * 8;

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
