<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Erdoğan ÖZTÜRK — Yazılım Mimarı / Danışman / Eğitmen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&amp;family=JetBrains+Mono:wght@300;400;500;600&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080a0f;
      color: #f8fafc;
      font-family: 'JetBrains Mono', monospace;
    }
    
    .font-cinzel {
      font-family: 'Cinzel', serif;
    }
    
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Glow ve Tipografi efektleri */
    .glow-cyan {
      text-shadow: 0 0 14px rgba(34, 211, 238, 0.8), 0 0 32px rgba(34, 211, 238, 0.45);
    }
    .glow-gold {
      text-shadow: 0 0 14px rgba(245, 158, 11, 0.8), 0 0 32px rgba(245, 158, 11, 0.4);
    }
    .glow-silver {
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.7), 0 0 28px rgba(148, 163, 184, 0.4);
    }
    
    /* İnce ışıltı çizgisi */
    .subtle-line {
      background: linear-gradient(90deg, transparent 0%, rgba(34, 211, 238, 0.6) 30%, rgba(245, 158, 11, 0.6) 70%, transparent 100%);
    }

    /* Atmosferik arka plan aydınlatması */
    .ambient-glow {
      background: radial-gradient(circle at center, rgba(14, 165, 233, 0.12) 0%, rgba(245, 158, 11, 0.05) 50%, transparent 75%);
    }
  </style>
</head>
<body class="relative w-full h-full flex flex-col justify-center items-center select-none overflow-hidden bg-[#080a0f]">
<!-- Tam Ekran 3D Three.js Sahnesi -->
<div class="absolute inset-0 w-full h-full z-0 pointer-events-auto overflow-hidden" id="canvas-container">
<!-- STITCH_THREEJS_START:ANIMATION_18 class="absolute inset-0 w-full h-full bg-transparent z-0 pointer-events-auto" -->
<div class="absolute inset-0 w-full h-full bg-transparent z-0 pointer-events-auto" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_18" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_18');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth || 390;
const height = container.clientHeight || window.innerHeight || 844;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
camera.position.z = 24;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0); // fully transparent background
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
scene.add(ambientLight);

const pointLightCyan = new THREE.PointLight(0x22d3ee, 3.5, 60);
pointLightCyan.position.set(12, 10, 15);
scene.add(pointLightCyan);

const pointLightAmber = new THREE.PointLight(0xf59e0b, 3.0, 60);
pointLightAmber.position.set(-12, -10, 15);
scene.add(pointLightAmber);

const coreGroup = new THREE.Group();
scene.add(coreGroup);

// 1. Central Core Sphere - 3D Wireframe Icosahedron
const coreGeo = new THREE.IcosahedronGeometry(2.4, 2);
const coreMat = new THREE.MeshStandardMaterial({
  color: 0x38bdf8,
  emissive: 0x0284c7,
  wireframe: true,
  roughness: 0.2,
  metalness: 0.1,
  transparent: true,
  opacity: 0.75
});
const coreMesh = new THREE.Mesh(coreGeo, coreMat);
coreGroup.add(coreMesh);

// Soft inner core glow node
const innerNodeGeo = new THREE.SphereGeometry(1.2, 16, 16);
const innerNodeMat = new THREE.MeshBasicMaterial({
  color: 0x22d3ee,
  wireframe: true,
  transparent: true,
  opacity: 0.6
});
const innerNode = new THREE.Mesh(innerNodeGeo, innerNodeMat);
coreGroup.add(innerNode);

// 2. Cosmic Orbital Rings (Prominent, High-visibility Torus meshes)
const rings = [];
const ringConfigs = [
  { radius: 4.8, tube: 0.08, color: 0x22d3ee, rx: 1.1, ry: 0.4, rz: 0.2, sx: 0.003, sy: 0.002, sz: 0.001 },
  { radius: 6.8, tube: 0.07, color: 0x38bdf8, rx: 0.4, ry: 1.2, rz: 0.5, sx: -0.002, sy: 0.003, sz: 0.002 },
  { radius: 8.8, tube: 0.08, color: 0xf59e0b, rx: 0.9, ry: -0.7, rz: 1.0, sx: 0.002, sy: -0.002, sz: 0.003 },
  { radius: 10.8, tube: 0.06, color: 0x10b981, rx: -0.8, ry: 0.5, rz: -0.6, sx: -0.0015, sy: 0.002, sz: -0.002 }
];

ringConfigs.forEach((cfg) => {
  const ringGeo = new THREE.TorusGeometry(cfg.radius, cfg.tube, 20, 120);
  const ringMat = new THREE.MeshStandardMaterial({
    color: cfg.color,
    emissive: cfg.color,
    emissiveIntensity: 0.35,
    roughness: 0.3,
    metalness: 0.2,
    transparent: true,
    opacity: 0.85
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.set(cfg.rx, cfg.ry, cfg.rz);
  coreGroup.add(ring);
  rings.push({ mesh: ring, sx: cfg.sx, sy: cfg.sy, sz: cfg.sz });
});

// 3. Starlight & Particles
const particlesCount = 650;
const particlePositions = new Float32Array(particlesCount * 3);
const particleColors = new Float32Array(particlesCount * 3);

const colorCyan = new THREE.Color(0x38bdf8);
const colorGold = new THREE.Color(0xfbbf24);
const colorWhite = new THREE.Color(0xffffff);

for (let i = 0; i < particlesCount; i++) {
  const rad = 4 + Math.random() * 26;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos((Math.random() * 2) - 1);

  particlePositions[i * 3] = rad * Math.sin(phi) * Math.cos(theta);
  particlePositions[i * 3 + 1] = rad * Math.sin(phi) * Math.sin(theta);
  particlePositions[i * 3 + 2] = rad * Math.cos(phi);

  let c = colorWhite;
  const rnd = Math.random();
  if (rnd < 0.45) c = colorCyan;
  else if (rnd < 0.75) c = colorGold;

  particleColors[i * 3] = c.r;
  particleColors[i * 3 + 1] = c.g;
  particleColors[i * 3 + 2] = c.b;
}

const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

const particleMat = new THREE.PointsMaterial({
  size: 0.16,
  vertexColors: true,
  transparent: true,
  opacity: 0.8
});

const particleSystem = new THREE.Points(particleGeo, particleMat);
scene.add(particleSystem);

// Smooth gentle touch / mouse parallax & rotation interaction
let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
let isDragging = false, prevX = 0, prevY = 0;

function onPointerDown(e) {
  isDragging = true;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  prevX = clientX;
  prevY = clientY;
}

function onPointerMove(e) {
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  
  if (isDragging) {
    const deltaX = clientX - prevX;
    const deltaY = clientY - prevY;
    coreGroup.rotation.y += deltaX * 0.008;
    coreGroup.rotation.x += deltaY * 0.008;
    prevX = clientX;
    prevY = clientY;
  }
  
  const halfX = window.innerWidth / 2;
  const halfY = window.innerHeight / 2;
  targetX = (clientX - halfX) * 0.0005;
  targetY = (clientY - halfY) * 0.0005;
}

function onPointerUp() {
  isDragging = false;
}

window.addEventListener('mousedown', onPointerDown, { passive: true });
window.addEventListener('mousemove', onPointerMove, { passive: true });
window.addEventListener('mouseup', onPointerUp, { passive: true });
window.addEventListener('touchstart', onPointerDown, { passive: true });
window.addEventListener('touchmove', onPointerMove, { passive: true });
window.addEventListener('touchend', onPointerUp, { passive: true });

function onWindowResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onWindowResize);

let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();

  mouseX += (targetX - mouseX) * 0.04;
  mouseY += (targetY - mouseY) * 0.04;

  coreGroup.rotation.y += 0.004;
  coreGroup.rotation.x = Math.sin(elapsedTime * 0.3) * 0.08 + mouseY * 1.5;
  coreGroup.rotation.z = Math.cos(elapsedTime * 0.2) * 0.05 + mouseX * 1.5;

  innerNode.rotation.y = -elapsedTime * 0.2;
  innerNode.scale.setScalar(1 + Math.sin(elapsedTime * 1.5) * 0.09);

  rings.forEach((r) => {
    r.mesh.rotation.x += r.sx;
    r.mesh.rotation.y += r.sy;
    r.mesh.rotation.z += r.sz;
  });

  particleSystem.rotation.y = elapsedTime * 0.012;
  particleSystem.rotation.x = Math.cos(elapsedTime * 0.02) * 0.03;

  renderer.render(scene, camera);
}
animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_18 -->
</div>
<!-- Merkez Kart: Erdoğan Öztürk — Yazılım Mimarı / Danışman / Eğitmen -->
<main class="relative z-10 w-full max-w-4xl px-4 sm:px-6 flex flex-col items-center justify-center my-auto pointer-events-none">
  <div class="relative w-full py-8 sm:py-12 px-6 sm:px-12 rounded-3xl border border-white/[0.08] bg-[#080b12]/60 backdrop-blur-xl shadow-[0_20px_60px_-15px_rgba(0,0,0,0.85)] flex flex-col items-center text-center overflow-hidden">
    
    <!-- Ambient Işık Atmosferi -->
    <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-96 h-32 bg-cyan-500/15 blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 left-1/2 -translate-x-1/2 w-96 h-32 bg-amber-500/10 blur-3xl pointer-events-none"></div>

    <!-- İsim -->
    <div class="relative z-10 flex flex-col items-center">
      <h1 class="text-2xl sm:text-4xl md:text-5xl font-light tracking-[0.22em] sm:tracking-[0.3em] uppercase text-transparent bg-clip-text bg-gradient-to-b from-white via-slate-100 to-slate-400 font-cinzel drop-shadow-[0_2px_14px_rgba(255,255,255,0.18)]">
        ERDOĞAN ÖZTÜRK
      </h1>
    </div>

    <!-- İnce Mimari Işık Hattı -->
    <div class="relative z-10 w-full max-w-md h-[1px] my-6 sm:my-8 bg-gradient-to-r from-transparent via-cyan-400/40 via-amber-400/40 to-transparent"></div>

    <!-- Roller -->
    <div class="relative z-10 w-full flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4 md:gap-5 font-mono-code">
      <!-- 1. Yazılım Mimarı -->
      <div class="w-full sm:w-auto px-5 py-2.5 rounded-full border border-cyan-500/30 bg-cyan-950/25 backdrop-blur-md flex items-center justify-center gap-2.5 shadow-[0_0_20px_rgba(34,211,238,0.1)]">
        <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee]"></span>
        <span class="text-xs sm:text-sm font-medium tracking-[0.2em] text-cyan-300 uppercase">
          YAZILIM MİMARI
        </span>
      </div>

      <span class="hidden sm:inline-block text-white/20 text-xs">/</span>

      <!-- 2. Danışman -->
      <div class="w-full sm:w-auto px-5 py-2.5 rounded-full border border-amber-500/30 bg-amber-950/25 backdrop-blur-md flex items-center justify-center gap-2.5 shadow-[0_0_20px_rgba(245,158,11,0.1)]">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400 shadow-[0_0_8px_#f59e0b]"></span>
        <span class="text-xs sm:text-sm font-medium tracking-[0.2em] text-amber-300 uppercase">
          DANIŞMAN
        </span>
      </div>

      <span class="hidden sm:inline-block text-white/20 text-xs">/</span>

      <!-- 3. Eğitmen -->
      <div class="w-full sm:w-auto px-5 py-2.5 rounded-full border border-emerald-500/30 bg-emerald-950/25 backdrop-blur-md flex items-center justify-center gap-2.5 shadow-[0_0_20px_rgba(16,185,129,0.1)]">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_8px_#10b981]"></span>
        <span class="text-xs sm:text-sm font-medium tracking-[0.2em] text-emerald-300 uppercase">
          EĞİTMEN
        </span>
      </div>
    </div>

    <!-- Köşe Vurguları (Minimalist Precision Brackets) -->
    <div class="absolute top-3 left-3 w-2 h-2 border-t border-l border-cyan-400/40"></div>
    <div class="absolute top-3 right-3 w-2 h-2 border-t border-r border-cyan-400/40"></div>
    <div class="absolute bottom-3 left-3 w-2 h-2 border-b border-l border-amber-400/40"></div>
    <div class="absolute bottom-3 right-3 w-2 h-2 border-b border-r border-amber-400/40"></div>
  </div>
</main>
</body></html>
