<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>erdogan.kim · 3D</title>
<style>
  :root {
    --bg: #0a0b0f;
    --fg: #e7e7ea;
    --muted: #8b8e97;
    --line: #23262d;
    --accent: #f0a45a;
    --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--sans); }

  #webgl, #css3d {
    position: fixed; inset: 0;
  }
  #css3d { pointer-events: none; }
  #css3d .panel { pointer-events: auto; }

  /* --- HUD --- */
  .hud {
    position: fixed; z-index: 20;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
    user-select: none;
  }
  .hud.tl { top: 20px; left: 22px; }
  .hud.tr { top: 20px; right: 22px; text-align: right; }
  .hud.bl { bottom: 20px; left: 22px; }
  .hud.br { bottom: 20px; right: 22px; text-align: right; }
  .hud b { color: var(--fg); font-weight: 500; }
  .hud .dot { color: var(--accent); }
  .hud .sep { color: var(--line); margin: 0 8px; }
  .key { border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; color: var(--fg); }

  /* --- 3D Panels --- */
  .panel {
    width: 420px;
    background: rgba(14,15,18,0.78);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 26px 28px;
    color: var(--fg);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(240,164,90,0.05) inset;
    transition: border-color .3s, box-shadow .3s, transform .3s;
  }
  .panel:hover {
    border-color: var(--accent);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 40px rgba(240,164,90,0.15);
    transform: translateZ(10px);
  }
  .panel .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .panel h3 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 28px;
    line-height: 1.15;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }
  .panel p {
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--fg);
    margin: 0 0 10px;
  }
  .panel p.muted { color: var(--muted); font-size: 13px; }
  .panel a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
  .panel .row {
    display: flex; justify-content: space-between;
    padding: 8px 0; border-top: 1px solid var(--line);
    font-size: 13px;
  }
  .panel .row:first-of-type { border-top: none; padding-top: 4px; }
  .panel .row .t { color: var(--fg); }
  .panel .row .d { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
  .panel .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .panel .tag {
    font-family: var(--mono); font-size: 11px;
    padding: 3px 8px; border: 1px solid var(--line); border-radius: 20px;
    color: var(--muted);
  }

  /* Hero panel (center, large) */
  .hero-panel {
    width: 520px;
    padding: 40px 44px;
    background: rgba(10,11,15,0.65);
    border: 1px solid rgba(240,164,90,0.3);
    text-align: center;
  }
  .hero-panel .brand {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.15em;
    color: var(--accent);
    margin-bottom: 20px;
  }
  .hero-panel h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 46px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 14px;
  }
  .hero-panel h1 .light { color: var(--muted); font-style: italic; display: block; font-size: 22px; margin-top: 10px; }
  .hero-panel .tag-line {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }

  /* Loading */
  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.2em;
    z-index: 50;
    transition: opacity .6s;
  }
  #loading.gone { opacity: 0; pointer-events: none; }
  #loading .blink { animation: blink 1.2s infinite; color: var(--accent); }
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0.2; } }
</style>
</head>
<body>

<div id="loading">
  <span><span class="blink">◆</span>&nbsp;&nbsp;ERDOGAN.KIM · YÜKLENİYOR</span>
</div>

<div id="webgl"></div>
<div id="css3d"></div>

<div class="hud tl">
  <div><span class="dot">◆</span> <b>erdogan.kim</b></div>
  <div style="margin-top:4px;">KİŞİSEL DEFTER · 3D</div>
</div>

<div class="hud tr">
  <div><b>ERDOĞAN ÖZTÜRK</b></div>
  <div style="margin-top:4px;">YAZILIM MİMARI · İSTANBUL</div>
</div>

<div class="hud bl">
  <span class="key">SOL TIK</span> döndür
  <span class="sep">·</span>
  <span class="key">SAĞ TIK</span> kaydır
  <span class="sep">·</span>
  <span class="key">TEKER</span> yakınlaş
</div>

<div class="hud br">
  <div>v0.1 · ilk taslak</div>
  <div style="margin-top:4px;"><b>4</b> bölüm &nbsp;<span class="sep">·</span>&nbsp; <b>∞</b> soru</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

// ================== WEBGL SCENE ==================
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0b0f, 0.015);

const camera = new THREE.PerspectiveCamera(
  55, window.innerWidth / window.innerHeight, 0.1, 500
);
camera.position.set(0, 6, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.getElementById('webgl').appendChild(renderer.domElement);

// ================== CSS3D SCENE ==================
const cssScene = new THREE.Scene();
const cssRenderer = new CSS3DRenderer();
cssRenderer.setSize(window.innerWidth, window.innerHeight);
cssRenderer.domElement.style.position = 'absolute';
cssRenderer.domElement.style.top = '0';
document.getElementById('css3d').appendChild(cssRenderer.domElement);

// ================== CONTROLS ==================
const controls = new OrbitControls(camera, cssRenderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 8;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 2, 0);

// ================== BACKGROUND GRADIENT ==================
const bg = new THREE.Mesh(
  new THREE.SphereGeometry(200, 32, 32),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      top:    { value: new THREE.Color(0x1a1030) },
      bottom: { value: new THREE.Color(0x06070a) }
    },
    vertexShader: `varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vPos; uniform vec3 top; uniform vec3 bottom;
      void main(){ float h = normalize(vPos).y*0.5+0.5; gl_FragColor = vec4(mix(bottom, top, h), 1.0); }`
  })
);
scene.add(bg);

// ================== GRID FLOOR ==================
const grid = new THREE.GridHelper(80, 40, 0x2a2033, 0x1a1420);
grid.position.y = -2;
grid.material.transparent = true;
grid.material.opacity = 0.5;
scene.add(grid);

// subtle reflective floor
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(40, 64),
  new THREE.MeshBasicMaterial({ color: 0x0a0a12, transparent: true, opacity: 0.6 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.001;
scene.add(floor);

// ================== LIGHTS ==================
scene.add(new THREE.AmbientLight(0x4a4a66, 0.6));
const pl1 = new THREE.PointLight(0xf0a45a, 2.5, 50);
pl1.position.set(0, 8, 0);
scene.add(pl1);
const pl2 = new THREE.PointLight(0x6b9cff, 1.2, 40);
pl2.position.set(-10, 4, -10);
scene.add(pl2);

// ================== CENTRAL DIAMOND ==================
const diamondGeo = new THREE.OctahedronGeometry(1.3, 0);
const diamondMat = new THREE.MeshPhysicalMaterial({
  color: 0xf0a45a,
  metalness: 0.3,
  roughness: 0.15,
  clearcoat: 1.0,
  emissive: 0xf0a45a,
  emissiveIntensity: 0.35,
  transmission: 0.3,
  thickness: 1.0
});
const diamond = new THREE.Mesh(diamondGeo, diamondMat);
diamond.position.set(0, 6, 0);
scene.add(diamond);

// glow around diamond
const diamondGlow = new THREE.Mesh(
  new THREE.SphereGeometry(2.4, 32, 32),
  new THREE.ShaderMaterial({
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    uniforms: { c: { value: new THREE.Color(0xf0a45a) } },
    vertexShader: `varying vec3 vN; void main(){ vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vN; uniform vec3 c; void main(){ float i = pow(1.0 - abs(vN.z), 2.5); gl_FragColor = vec4(c*i, i*0.8); }`
  })
);
diamondGlow.position.copy(diamond.position);
scene.add(diamondGlow);

// ================== CONNECTION LINES (architecture-like) ==================
const connectMat = new THREE.LineBasicMaterial({
  color: 0xf0a45a,
  transparent: true,
  opacity: 0.18
});

// ================== PANELS ==================
const panelData = [
  {
    id: 'hero',
    cls: 'panel hero-panel',
    pos: [0, 2, 0],
    rotY: 0,
    html: `
      <div class="brand">◆ &nbsp; erdogan.kim</div>
      <h1>Erdoğan Öztürk.
        <span class="light">Sistemler tasarlar, kod yazar, yazar.</span>
      </h1>
      <div class="tag-line">YAZILIM MİMARI &nbsp;·&nbsp; İSTANBUL &nbsp;·&nbsp; 15+ YIL</div>
    `
  },
  {
    id: 'kim',
    pos: [-14, 2, -2],
    rotY: Math.PI / 7,
    html: `
      <div class="eyebrow">§ Kim</div>
      <h3>Kaotik görüneni anlaşılır hâle getirmek.</h3>
      <p>
        Ankara'nın bir mahallesinde, babamın getirdiği ikinci el bir bilgisayarla başladı.
        Bankalardan e-ticarete, oyun arka uçlarından sağlık sistemlerine —
        hep aynı işi yaptım: karmaşanın içinden basit bir hat çekmeye çalışmak.
      </p>
      <p class="muted" style="margin-top:12px; font-style:italic;">
        "İyi mimar, çizdiği her çizgiden önce neyi çizmeyeceğine karar verendir."
      </p>
    `
  },
  {
    id: 'simdi',
    pos: [14, 2, -2],
    rotY: -Math.PI / 7,
    html: `
      <div class="eyebrow">§ Şimdi</div>
      <h3>Üzerinde düşündüklerim.</h3>
      <div class="row"><span class="t">Çalışma</span><span class="d">Event-driven göç</span></div>
      <div class="row"><span class="t">Okuma</span><span class="d">Team Topologies</span></div>
      <div class="row"><span class="t">Soru</span><span class="d">"Sınır nerede?"</span></div>
      <div class="tags">
        <span class="tag">Rust</span>
        <span class="tag">Temporal.io</span>
        <span class="tag">OTel</span>
        <span class="tag">CRDTs</span>
        <span class="tag">DuckDB</span>
      </div>
    `
  },
  {
    id: 'yazilar',
    pos: [-12, 2, 10],
    rotY: Math.PI / 4.5,
    html: `
      <div class="eyebrow">§ Son Yazılar</div>
      <h3>Defterden parçalar.</h3>
      <div class="row"><span class="t"><a href="#">Bounded context üzerine notlar</a></span><span class="d">12 Nis</span></div>
      <div class="row"><span class="t"><a href="#">Geri alınamayan kararlar</a></span><span class="d">28 Mar</span></div>
      <div class="row"><span class="t"><a href="#">ADR'nin terapötik faydaları</a></span><span class="d">14 Mar</span></div>
      <div class="row"><span class="t"><a href="#">Basit tut demek kolay</a></span><span class="d">2 Mar</span></div>
      <div class="row"><span class="t"><a href="#">Bir mimarın günlük rutini</a></span><span class="d">19 Şub</span></div>
    `
  },
  {
    id: 'iletisim',
    pos: [12, 2, 10],
    rotY: -Math.PI / 4.5,
    html: `
      <div class="eyebrow">§ İletişim</div>
      <h3>Bir kahve içelim.</h3>
      <p class="muted">Yeni bir problem, eski bir soru ya da sadece selam:</p>
      <div class="row"><span class="t">E-posta</span><span class="d"><a href="mailto:merhaba@erdogan.kim">merhaba@erdogan.kim</a></span></div>
      <div class="row"><span class="t">GitHub</span><span class="d"><a href="#">@erdoganozturk</a></span></div>
      <div class="row"><span class="t">LinkedIn</span><span class="d"><a href="#">/in/erdoganozturk</a></span></div>
      <div class="row"><span class="t">RSS</span><span class="d"><a href="#">feed.xml</a></span></div>
    `
  }
];

const panels = [];
for (const p of panelData) {
  const el = document.createElement('div');
  el.className = p.cls || 'panel';
  el.innerHTML = p.html;
  const obj = new CSS3DObject(el);
  obj.position.set(...p.pos);
  obj.rotation.y = p.rotY || 0;
  obj.scale.set(0.02, 0.02, 0.02); // CSS3D pixels -> world units
  cssScene.add(obj);
  panels.push({ obj, data: p });

  // Connection line from diamond to panel (except hero)
  if (p.id !== 'hero') {
    const lineGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 6, 0),
      new THREE.Vector3(p.pos[0], p.pos[1], p.pos[2])
    ]);
    scene.add(new THREE.Line(lineGeo, connectMat));
  }
}

// ================== FLOATING ACCENT SHAPES ==================
const accentGeos = [
  new THREE.TetrahedronGeometry(0.5),
  new THREE.OctahedronGeometry(0.45),
  new THREE.IcosahedronGeometry(0.4)
];
const accents = [];
for (let i = 0; i < 24; i++) {
  const g = accentGeos[i % accentGeos.length];
  const m = new THREE.MeshStandardMaterial({
    color: i % 2 ? 0xf0a45a : 0x6b9cff,
    metalness: 0.6,
    roughness: 0.3,
    emissive: i % 2 ? 0xf0a45a : 0x6b9cff,
    emissiveIntensity: 0.2
  });
  const mesh = new THREE.Mesh(g, m);
  const r = 16 + Math.random() * 14;
  const a = Math.random() * Math.PI * 2;
  mesh.position.set(
    Math.cos(a) * r,
    Math.random() * 10 + 1,
    Math.sin(a) * r
  );
  mesh.userData = {
    baseY: mesh.position.y,
    phase: Math.random() * Math.PI * 2,
    speed: 0.3 + Math.random() * 0.5,
    rot: new THREE.Vector3(
      (Math.random()-0.5)*0.01,
      (Math.random()-0.5)*0.01,
      (Math.random()-0.5)*0.01
    )
  };
  scene.add(mesh);
  accents.push(mesh);
}

// ================== PARTICLE FIELD ==================
const pCount = 1200;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(pCount * 3);
for (let i = 0; i < pCount; i++) {
  const r = 8 + Math.random() * 60;
  const t = Math.random() * Math.PI * 2;
  pPos[i*3]   = Math.cos(t) * r;
  pPos[i*3+1] = (Math.random() - 0.2) * 25;
  pPos[i*3+2] = Math.sin(t) * r;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: 0.05, color: 0xf0a45a, transparent: true, opacity: 0.5,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
scene.add(particles);

// ================== RESIZE ==================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  cssRenderer.setSize(window.innerWidth, window.innerHeight);
});

// ================== ANIMATE ==================
const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();

  // diamond rotation + pulse
  diamond.rotation.y = t * 0.3;
  diamond.rotation.x = Math.sin(t * 0.5) * 0.2;
  const s = 1 + Math.sin(t * 1.5) * 0.04;
  diamond.scale.setScalar(s);
  diamondGlow.scale.setScalar(1 + Math.sin(t * 1.5) * 0.1);

  // floating accents
  for (const m of accents) {
    const d = m.userData;
    m.position.y = d.baseY + Math.sin(t * d.speed + d.phase) * 0.5;
    m.rotation.x += d.rot.x;
    m.rotation.y += d.rot.y;
    m.rotation.z += d.rot.z;
  }

  particles.rotation.y = t * 0.02;

  controls.update();
  renderer.render(scene, camera);
  cssRenderer.render(cssScene, camera);

  requestAnimationFrame(animate);
}

// ================== GO ==================
animate();
setTimeout(() => {
  document.getElementById('loading').classList.add('gone');
}, 600);

// gentle auto-rotate intro
let introT = 0;
const autoIntro = () => {
  if (introT > 2.5) return;
  introT += 0.016;
  controls.azimuthAngle -= 0.003;
  requestAnimationFrame(autoIntro);
};
</script>

</body>
</html>
